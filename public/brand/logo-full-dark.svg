  <text x="126" y="96" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.6" fill="#9FB2C2">HUMAN TEACHING. LIFE-CHANGING TOOLS.</text>
