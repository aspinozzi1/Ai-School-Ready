# Continuous Integration — runs automatically on every pull request and on
# pushes to main. It lints the code and does a full production build, so a
# change that breaks the build can't be merged by accident.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The build runs with no secrets on purpose — the app is designed to build
      # and run the public site without any environment variables configured.
      - name: Build
        run: npm run build
