# Netlify build config for the Next.js app.
#
# These values mirror what was previously set only in the Netlify UI, so the
# deploy is reproducible from the repo. The Next.js runtime plugin is what
# turns `next build` output into Netlify functions + edge handlers; Netlify
# installs it automatically from the registry, so it needs no npm dependency.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Turbopack writes server-side env values (RESEND_API_KEY, STRIPE_SECRET_KEY)
  # into its build cache. That cache is a build artifact and is never deployed,
  # but Netlify's secrets scanner reads it and fails the build. Scan everything
  # that ships; skip the cache.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"
